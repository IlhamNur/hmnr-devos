version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hmnr-devos-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./php.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - postgres
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-hmnr_devos}
      - DB_USERNAME=${DB_USERNAME:-hmnr_devos}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - MVEL_EXECUTOR_URL=http://mvel-executor:8080/execute

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE:-hmnr_devos}
      - POSTGRES_USER=${DB_USERNAME:-hmnr_devos}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mvel-executor:
    image: openjdk:17-slim
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./mvel-executor:/app
    working_dir: /app
    # Note: You'll need to compile and run a simple spring-boot or spark-java app here.
    # Placeholder for the command to run the MVEL executor
    command: ["java", "-jar", "mvel-executor.jar"]

volumes:
  postgres_data:

